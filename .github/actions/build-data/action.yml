name: Build vPIC data artifact
description: >
  Materialize and verify the embedded crates/ultravin/data/vpic.rkyv from the
  dump pinned in vpic/manifest.json. Self-verifying (dump sha256 + artifact blake3)
  and cached by that blake3 plus a hash of the crate sources that produce it, so an
  unchanged pin *and* unchanged importer skips the download and import entirely.
  Requires a Rust toolchain, jq, and python3 (preinstalled on GH runners).

runs:
  using: composite
  steps:
    - name: Read pinned dump metadata
      id: meta
      shell: bash
      env:
        # Every input that decides the artifact's bytes besides the dump itself:
        # the importer, the core crate it links (serialize_artifact, cover), the
        # build scripts, and the exact dependency versions. Folded into the cache
        # key below — see the comment there for why the manifest alone is not
        # enough. Deliberately broad (`crates/**`, so a crate added later is
        # covered for free): a needless rebuild costs minutes, a missed one
        # costs correctness.
        SRC_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'crates/**/build.rs', 'crates/**/src/**') }}
      run: |
        # hashFiles yields "" when nothing matches (typo'd glob, no checkout).
        # An empty component would quietly reduce the key back to the manifest
        # digest — the exact hole this closes — so refuse rather than degrade.
        if [ -z "$SRC_HASH" ]; then
          echo "::error::hashFiles matched no crate sources; the vpic-artifact cache key would stop tracking artifact-affecting code"
          exit 1
        fi
        month=$(jq -r .month vpic/manifest.json)
        url=$(jq -r .source_url vpic/manifest.json)
        # `month` is the one manifest field nothing else pins down. source_url,
        # dump_sha256 and artifact_blake3 all verify each other below, but month
        # only reaches `--month`, whose sole artifact effect is cover_year — so a
        # same-year edit yields byte-identical artifact bytes, and on a cache HIT
        # (no month edit moves either key component: artifact_blake3 or the
        # source hash) the build steps that would notice even a cross-year edit
        # never run. Assert it against the pinned dump's own filename here: first
        # step, no cache-hit guard, so a PR cannot desync month from the dump it
        # names. That desync is not cosmetic — ci.yaml's answerkey job decides
        # whether to run the parity gate by comparing the answer-key pin against
        # this month, so a bogus month skips the gate outright.
        case "$url" in
          *"/vPICList_lite_${month}.plain.zip") ;;
          *)
            echo "::error::vpic/manifest.json month '$month' does not match source_url '$url' (expected a URL ending in /vPICList_lite_${month}.plain.zip)"
            exit 1
            ;;
        esac
        {
          echo "month=$month"
          echo "url=$url"
          echo "dump_sha256=$(jq -r .dump_sha256 vpic/manifest.json)"
          echo "artifact_blake3=$(jq -r .artifact_blake3 vpic/manifest.json)"
          echo "src_hash=$SRC_HASH"
        } >> "$GITHUB_OUTPUT"
    # The artifact is a pure function of (pinned dump, importer code), so the key
    # must name BOTH. artifact_blake3 covers the dump: it moves whenever the pin
    # does, and keeps two data months from colliding. src_hash covers the code —
    # and it is load-bearing, not belt-and-braces. On a keyed-by-manifest-only
    # hit, every download/build/verify step below is skipped and the surviving
    # re-hash compares the restored OLD bytes against the OLD digest the same
    # manifest supplies: green, forever. So a commit that changed artifact-
    # affecting Rust (cover.rs is baked in at build time) without refreshing
    # vpic/manifest.json would never rebuild, master's manifest would rot
    # silently, and the eventual cache eviction — not the offending commit —
    # would be what turned CI red. Keying on the sources makes that commit miss
    # the cache, rebuild for real, and fail its own verification.
    - name: Cache built artifact
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: crates/ultravin/data/vpic.rkyv
        key: vpic-artifact-${{ steps.meta.outputs.artifact_blake3 }}-${{ steps.meta.outputs.src_hash }}
    - name: Download pinned vPIC dump
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DUMP_URL: ${{ steps.meta.outputs.url }}
      run: curl -fSL --retry 3 "$DUMP_URL" -o "$RUNNER_TEMP/dump.zip"
    - name: Verify dump sha256
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DUMP_SHA256: ${{ steps.meta.outputs.dump_sha256 }}
      run: echo "$DUMP_SHA256  $RUNNER_TEMP/dump.zip" | sha256sum -c -
    - name: Build artifact (deterministic; emits crates/ultravin/data/vpic.rkyv)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MONTH: ${{ steps.meta.outputs.month }}
      run: cargo run -p ultravin-build --release --locked -- --dump "$RUNNER_TEMP/dump.zip" --month "$MONTH" --out "$RUNNER_TEMP/vpic-verify"
    - name: Verify emitted artifact blake3 matches manifest
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WANT_BLAKE3: ${{ steps.meta.outputs.artifact_blake3 }}
      run: |
        got=$(jq -r .artifact_blake3 "$RUNNER_TEMP/vpic-verify/manifest.json")
        want="$WANT_BLAKE3"
        if [ "$got" != "$want" ]; then
          echo "artifact blake3 mismatch: got $got, want $want" >&2
          exit 1
        fi
        echo "artifact verified: $got"
    - name: Confirm artifact present
      shell: bash
      run: test -s crates/ultravin/data/vpic.rkyv
    # Independent integrity gate — UNCONDITIONAL (no cache-hit guard): on a cache
    # HIT this is the ONLY verification that runs, so a poisoned cache entry cannot
    # ship unverified into the wheels/sdist; on a MISS it's a cheap belt-and-braces
    # check. We re-hash the restored bytes ourselves rather than trusting any
    # importer-emitted manifest. The header layout and hash scheme below MUST stay
    # in sync with `serialize_artifact` in crates/ultravin/src/tables.rs (the
    # source of truth): 64-byte header [magic "ULTRAVIN"(8) | format u16 | builder
    # version u32 | blake3(32) | ...], rkyv body at [64:], and the recorded digest
    # is blake3(body || builder_version_le) — NOT a plain whole-file hash. The
    # magic + format asserts are load-bearing: any future format/scheme change trips
    # them here loudly instead of letting this check silently drift.
    - name: Verify restored artifact integrity (independent re-hash)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # blake3 isn't in the Python stdlib, and uv is NOT guaranteed on every
        # caller's runner (release.yaml's build-data job sets up only Rust + jq;
        # uv is not preinstalled on ubuntu-latest), so pull the prebuilt blake3
        # wheel into a throwaway venv via the preinstalled python3 — a genuinely
        # independent implementation, no compile, and no dependency on the caller.
        # Pinned by sha256 (blake3-requirements.txt): this hash decides whether a
        # release ships, so a hijacked blake3 release must not be able to decide
        # it. --require-hashes also forbids any unpinned transitive dependency.
        python3 -m venv "$RUNNER_TEMP/b3venv"
        "$RUNNER_TEMP/b3venv/bin/pip" install --quiet --disable-pip-version-check \
          --require-hashes --only-binary=:all: -r "$ACTION_PATH/blake3-requirements.txt"
        want="$(jq -r .artifact_blake3 vpic/manifest.json)"
        export want
        "$RUNNER_TEMP/b3venv/bin/python" - <<'PY'
        import os
        import blake3

        want = os.environ["want"].strip().lower()
        data = open("crates/ultravin/data/vpic.rkyv", "rb").read()
        if data[:8] != b"ULTRAVIN":
            print(f"::error::vpic.rkyv bad magic {data[:8]!r}; expected b'ULTRAVIN'")
            raise SystemExit(1)
        fmt = int.from_bytes(data[8:10], "little")
        if fmt != 1:
            print(
                f"::error::vpic.rkyv format {fmt} != 1 — header/hash scheme changed; "
                "update this step to match serialize_artifact in tables.rs"
            )
            raise SystemExit(1)
        got = blake3.blake3(data[64:] + data[10:14]).hexdigest().lower()
        if got != want:
            print(f"::error::vpic.rkyv blake3 mismatch: got {got}, want {want}")
            raise SystemExit(1)
        print(f"artifact verified (independent re-hash): {got}")
        PY
