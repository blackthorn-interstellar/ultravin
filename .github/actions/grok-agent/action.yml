# Runs the xAI Grok Build CLI headless, the way this repo's agent lanes need it.
#
# Two things about grok 1.0.4 drive this action's shape, both verified against
# the CLI rather than inferred from the old claude-code-action inputs:
#
#  1. `--tools` takes INTERNAL tool ids (read_file, run_terminal_command, ...)
#     and is a hard allowlist: measured, `--tools "read_file,grep,list_dir"`
#     leaves exactly those plus the always-on MCP meta-tools. `--allow` /
#     `--deny` (whose compat aliases are spelled --allowedTools /
#     --disallowedTools) are permission RULES: they gate execution of tools that
#     remain available. Passing the old `--allowedTools "Read,..."` string here
#     would advertise the full 26-tool set and gate nothing, so `allowed_tools`
#     maps to --tools and nothing maps to the rule flags. A deny list is not
#     offered either: with a hard allowlist it can only remove tools already gone.
#  2. allowed_tools is the ONLY usable scoping mechanism. Permission rules
#     (--allow/--deny with a deny-by-default mode) are unusable in 1.0.4: a
#     rule denial cancels the whole session instead of failing one tool call,
#     so a scoped session dies on its first unmatched command. Hence no
#     allow_rules input and bypassPermissions everywhere.
#  3. `--json-schema` poisons the investigation it is supposed to describe.
#     grok-4.6 handed a schema stochastically satisfies it on turn 1 — a
#     schema-valid placeholder, clean end_turn, zero tool calls (3 of 4 review
#     runs in CI). So a json_schema run is split in two: stage A investigates
#     with no schema (nothing to short-circuit into) and must make at least one
#     tool call; stage B is a fresh two-turn session that gets the schema plus
#     stage A's own findings and only transcribes them. Zero tool calls is a
#     failure in A and the expectation in B.
#
# The `[toolset.bash]` limits must live in $HOME/.grok/config.toml: a project
# .grok/config.toml only contributes [mcp_servers], [plugins] and [permission],
# so a repo-local file would silently drop them.
name: Grok agent
description: Run the Grok Build CLI headless with a pinned version, a scoped toolset, and a JSONL transcript.

inputs:
  prompt:
    description: The prompt to send. Passed via --prompt-file, never through the shell.
    required: true
  xai_api_key:
    description: xAI API key (console.x.ai) used as XAI_API_KEY.
    required: true
  max_turns:
    description: Maximum agentic turns before the session stops.
    required: false
    default: "30"
  allowed_tools:
    description: >-
      Comma-separated INTERNAL tool ids the session may use (e.g.
      "read_file,grep"). A hard allowlist. Empty means grok's default toolset.
    required: false
    default: ""
  permission_mode:
    description: >-
      Permission mode. Keep bypassPermissions: grok 1.0.4 treats a permission
      RULE denial as a session cancellation rather than a recoverable tool
      error, so deny-by-default modes (dontAsk) kill a session on its first
      unmatched command. Scope a session with allowed_tools, which removes
      tools outright, not with permission rules.
    required: false
    default: bypassPermissions
  json_schema:
    description: >-
      JSON Schema constraining the reply. When set, structured_output carries
      the payload and the run splits into an unconstrained investigation plus a
      two-turn formalization (see the header note).
    required: false
    default: ""
  model:
    description: Model id to pin.
    required: false
    default: grok-4.6
  bash_timeout_secs:
    description: Foreground shell timeout. The 120s default kills this repo's 10-30 minute commands.
    required: false
    default: "2400"
  bash_output_byte_limit:
    description: Captured shell output cap. The 20000B default truncates make check logs.
    required: false
    default: "200000"
  grok_version:
    description: Pinned Grok CLI version.
    required: false
    default: 1.0.4
  grok_sha256:
    description: >-
      sha256 of the linux-x86_64 artifact for grok_version. Bump both together;
      get it from `curl -fsSL https://x.ai/cli/grok-<version>-linux-x86_64 | sha256sum`.
    required: false
    default: 79f49625f153923db491a5c290e9b04c3444da488b6b9d6aac533ccb5bff2455

outputs:
  execution_file:
    description: >-
      Path to the session transcript (streaming-json JSONL). With a schema it is
      the investigation transcript with the formalization's events appended.
    value: ${{ steps.run.outputs.execution_file }}
  structured_output:
    description: Compact JSON matching json_schema, or empty when no schema was given.
    value: ${{ steps.run.outputs.structured_output }}

runs:
  using: composite
  steps:
    # The published artifact, verified against a pinned digest — never
    # `curl https://x.ai/cli/install.sh | bash`, which executes whatever the
    # endpoint serves today. The artifact is a bare static ELF, so installing it
    # is a download, a checksum, and a chmod. Runners are ubuntu-latest, hence
    # the hardcoded linux-x86_64; another platform 404s here rather than
    # silently installing something unverified.
    - name: Install the Grok CLI
      shell: bash
      env:
        GROK_VERSION: ${{ inputs.grok_version }}
        GROK_SHA256: ${{ inputs.grok_sha256 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.grok/bin"
        curl -fsSL --retry 3 --max-time 600 \
          -o "$HOME/.grok/bin/grok" \
          "https://x.ai/cli/grok-${GROK_VERSION}-linux-x86_64"
        echo "${GROK_SHA256}  $HOME/.grok/bin/grok" | sha256sum -c -
        chmod +x "$HOME/.grok/bin/grok"
        # Invoked by absolute path below rather than exported onto $GITHUB_PATH,
        # which would be a needless code-execution surface for later steps.
        "$HOME/.grok/bin/grok" --version

    - name: Configure the toolset limits
      shell: bash
      env:
        BASH_TIMEOUT_SECS: ${{ inputs.bash_timeout_secs }}
        BASH_OUTPUT_BYTE_LIMIT: ${{ inputs.bash_output_byte_limit }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.grok"
        # Only [toolset] is read from $HOME; the repo's own .grok/config.toml
        # could not carry these.
        cat > "$HOME/.grok/config.toml" <<EOF
        [cli]
        auto_update = false

        [toolset.bash]
        timeout_secs = ${BASH_TIMEOUT_SECS}
        output_byte_limit = ${BASH_OUTPUT_BYTE_LIMIT}
        EOF
        cat "$HOME/.grok/config.toml"

    - name: Run the agent
      id: run
      shell: bash
      env:
        XAI_API_KEY: ${{ inputs.xai_api_key }}
        GROK_DISABLE_AUTOUPDATER: "1"
        PROMPT: ${{ inputs.prompt }}
        MAX_TURNS: ${{ inputs.max_turns }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        PERMISSION_MODE: ${{ inputs.permission_mode }}
        JSON_SCHEMA: ${{ inputs.json_schema }}
        MODEL: ${{ inputs.model }}
      run: |
        set -uo pipefail
        # `shell: bash` runs with -e; turn it off deliberately. Every failure
        # below is handled explicitly, and aborting on the first one would skip
        # writing $GITHUB_OUTPUT and swallow the diagnosis.
        set +e
        transcript="$RUNNER_TEMP/grok-transcript.jsonl"
        prompt_file="$RUNNER_TEMP/grok-prompt.txt"
        printf '%s' "$PROMPT" > "$prompt_file"

        args=(
          --prompt-file "$prompt_file"
          --output-format streaming-json
          --permission-mode "$PERMISSION_MODE"
          --max-turns "$MAX_TURNS"
          --model "$MODEL"
          --no-auto-update
        )
        if [ -n "$ALLOWED_TOOLS" ]; then args+=(--tools "$ALLOWED_TOOLS"); fi

        # Stage A. Identical to the whole run when no schema was asked for: the
        # schema is deliberately absent here even when one was given, because a
        # session that can end by emitting JSON tends to do exactly that before
        # investigating anything.
        # Tee so a two-hour session is visible live in the job log while the
        # JSONL lands on disk for the transcript artifact. PIPESTATUS, not $?,
        # because $? would report tee.
        "$HOME/.grok/bin/grok" "${args[@]}" | tee "$transcript"
        rc="${PIPESTATUS[0]}"

        # With a schema, "exited 0 but delivered no verdict" must be impossible:
        # grok can treat a stray line of assistant text as its terminal answer,
        # cancel its own pending tool calls, and still exit 0. Downstream that
        # looked like a healthy run with an empty verdict, and the fail-closed
        # gate then retried a check that was never coming.
        structured=""
        schema_rc=0
        schema_err="$RUNNER_TEMP/grok-schema-error.txt"
        findings="$RUNNER_TEMP/grok-findings.txt"
        schema_stage=investigation
        if [ -n "$JSON_SCHEMA" ]; then
          python3 "$GITHUB_ACTION_PATH/structured_output.py" --mode investigation "$transcript" \
            >"$findings" 2>"$schema_err"
          schema_rc=$?
        fi

        # Stage B. A fresh session whose only job is transcription: two turns,
        # the schema, and stage A's own findings via a FILE — never argv, which
        # would put model output on a command line. --tools takes the narrowest
        # read-only tool rather than "": an empty value is a no-op that
        # advertises the full 25-tool set (measured), not an empty allowlist.
        if [ -n "$JSON_SCHEMA" ] && [ "$schema_rc" = 0 ]; then
          schema_stage=verdict
          verdict_prompt="$RUNNER_TEMP/grok-verdict-prompt.txt"
          verdict_transcript="$RUNNER_TEMP/grok-verdict-transcript.jsonl"
          {
            printf '%s\n\n' "You already completed the investigation below. Emit ONLY the verdict as structured output conforming to the schema; no further investigation is possible."
            cat "$findings"
          } > "$verdict_prompt"

          "$HOME/.grok/bin/grok" \
            --prompt-file "$verdict_prompt" \
            --output-format streaming-json \
            --permission-mode "$PERMISSION_MODE" \
            --max-turns 2 \
            --model "$MODEL" \
            --no-auto-update \
            --tools read_file \
            --json-schema "$JSON_SCHEMA" | tee "$verdict_transcript"
          verdict_rc="${PIPESTATUS[0]}"

          # One artifact for the pair: stage A's transcript with stage B's
          # events appended.
          cat "$verdict_transcript" >> "$transcript"
          structured=$(python3 "$GITHUB_ACTION_PATH/structured_output.py" --mode verdict \
            "$verdict_transcript" 2>"$schema_err")
          schema_rc=$?
          if [ "$rc" = 0 ]; then rc="$verdict_rc"; fi
        fi

        {
          echo "execution_file=$transcript"
          echo "structured_output=$structured"
        } >> "$GITHUB_OUTPUT"

        case "$rc" in
          0) ;;
          130) echo "::error::grok was interrupted (SIGINT)" ;;
          143) echo "::error::grok was terminated (SIGTERM)" ;;
          *)   echo "::error::grok exited $rc" ;;
        esac

        if [ "$schema_rc" != 0 ]; then
          echo "::error::grok's $schema_stage stage produced nothing usable: $(cat "$schema_err")"
          if [ "$rc" = 0 ]; then rc=1; fi
        fi
        exit "$rc"
