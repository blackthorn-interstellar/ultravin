name: Merge data PR
description: >
  Synchronously complete a green data PR per policy: retry-merge until the
  required checks allow it, tag data-<month> on the merge commit, and (opt-in)
  push the next patch v-tag and dispatch release.yaml. No GitHub App: pushes
  and merges by GITHUB_TOKEN emit no events, so the next step is invoked
  explicitly via workflow_dispatch (the documented exception).
inputs:
  month:
    description: "YYYY_MM of the data PR (branch data/<month>)"
    required: true
  automerge:
    description: "merge data-only PRs when 'true'"
    required: true
  automerge-schema:
    description: "extend merging to schema-change PRs when 'true'"
    required: true
  autorelease:
    description: "tag the next patch version and dispatch release.yaml when 'true'"
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MONTH: ${{ inputs.month }}
        AUTOMERGE: ${{ inputs.automerge }}
        AUTOMERGE_SCHEMA: ${{ inputs.automerge-schema }}
        AUTORELEASE: ${{ inputs.autorelease }}
      run: |
        set -euo pipefail
        BR="data/$MONTH"
        if [ "$AUTOMERGE" != "true" ]; then
          echo "::notice::DATA_REFRESH_AUTOMERGE is off — PR left open for a human"
          exit 0
        fi
        pr=$(gh pr view "$BR" --json number --jq .number)
        # Classify from the TRUSTED git diff, not the agent-applied label, so a
        # missing label can't slip a schema/proc change past the
        # DATA_REFRESH_AUTOMERGE_SCHEMA boundary. Mirror scripts/refresh.py
        # classify(): a change under vpic/schema or vpic/procs is structural
        # (schema-change); so is anything outside the pure monthly-data set
        # (decoder code, scripts, packaging, .github). Only a clean data
        # regeneration is data-only. Fail closed — an unreadable or empty diff
        # is treated as schema-change, never merged.
        #
        # The list must be rename-VISIBLE, which `gh pr diff --name-only` is
        # not: GitHub's diff runs rename detection (`rename from`/`rename to`)
        # and gh prints only the b/ side, so `git mv vpic/schema/tables.sql
        # vpic/tables.sql` reads as a pure data change and would auto-merge.
        # Diff the PR head against its merge base with --no-renames instead,
        # which splits every rename back into a delete + an add so BOTH paths
        # get classified. Callers check out with fetch-depth: 0, and the PR head
        # is fetched explicitly so classification never depends on whatever the
        # job happens to have in its working tree.
        files=""
        if git fetch -q origin "+refs/heads/master:refs/classify/base" \
                               "+refs/pull/$pr/head:refs/classify/head"; then
          base=$(git merge-base refs/classify/base refs/classify/head)
          files=$(git diff --no-renames --name-only "$base" refs/classify/head)
        fi
        if [ -z "$files" ]; then
          echo "::warning::empty or unreadable diff for PR #$pr — treating as schema-change"
          cls="schema-change"
        elif printf '%s\n' "$files" | grep -qE '^vpic/(schema|procs)/'; then
          cls="schema-change"   # structural: mirrors refresh.py classify()
        elif printf '%s\n' "$files" | grep -qvE '^(vpic/|tests/parity_corpus\.json$)'; then
          cls="schema-change"   # decoder code / scripts / packaging / .github
        else
          cls="data-only"
        fi
        if [ "$cls" = "schema-change" ] && [ "$AUTOMERGE_SCHEMA" != "true" ]; then
          echo "::notice::schema-change PR left for human review (DATA_REFRESH_AUTOMERGE_SCHEMA=true opts in)"
          exit 0
        fi
        # Branch protection arbitrates: merge succeeds only once every required
        # check (CI + review-verdict) is green on the head SHA. Retry until then.
        head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
        verdict_runs() {
          gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=review-verdict" \
            --jq '.check_runs[] | "\(.status) \(.conclusion // "none")"' 2>/dev/null || true
        }
        merged=""
        for _ in $(seq 1 45); do
          if gh pr merge "$pr" --squash --delete-branch 2>/tmp/merge-err; then
            merged=1
            break
          fi
          # A rejected review-verdict never self-heals — the gate publishes one
          # completed conclusion per head SHA and nothing re-runs it — so waiting
          # out the full window only delays the report by 22 minutes. Keep
          # waiting while it is queued, in_progress, or absent (the reviewer
          # takes minutes to publish, and its absence is not a verdict); bail the
          # moment a failure is final with nothing newer pending for this SHA.
          runs=$(verdict_runs)
          if printf '%s\n' "$runs" | grep -q '^completed failure$' &&
             ! printf '%s\n' "$runs" | grep -qE '^(queued|in_progress) '; then
            echo "::error::review-verdict rejected $head — a red required gate does not self-heal, so not waiting out the merge window"
            gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=review-verdict" \
              --jq '.check_runs[] | "review-verdict \(.conclusion): \(.output.summary // .output.title // "no summary published")"' || true
            exit 1
          fi
          sleep 30
        done
        if [ -z "$merged" ]; then
          echo "::error::PR #$pr not mergeable after ~22 min; last error + check states:"
          cat /tmp/merge-err || true
          gh pr checks "$pr" || true
          exit 1
        fi
        sha=$(gh pr view "$pr" --json mergeCommit --jq .mergeCommit.oid)
        echo "merged PR #$pr at $sha" >> "$GITHUB_STEP_SUMMARY"
        git fetch origin master --tags -q
        if git rev-parse -q --verify "refs/tags/data-$MONTH" >/dev/null; then
          echo "tag data-$MONTH already exists"
        else
          git tag "data-$MONTH" "$sha"
          git push origin "data-$MONTH"
        fi
        # The data is on master now, so this is the moment to freeze the oracle's
        # answers for it. Dispatched rather than triggered: a tag pushed with
        # GITHUB_TOKEN emits no event, the same reason release.yaml is dispatched
        # below. Independent of autorelease — the key is a test asset, not a ship.
        gh workflow run answer-key.yaml --ref master -f month="$MONTH" \
          && echo "answer key build dispatched for $MONTH" >> "$GITHUB_STEP_SUMMARY" \
          || echo "::warning::could not dispatch the answer key build for $MONTH"
        if [ "$AUTORELEASE" = "true" ]; then
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          next=$(printf '%s' "${latest#v}" | awk -F. '{printf "v%d.%d.%d", $1, $2, $3 + 1}')
          git tag "$next" "$sha"
          git push origin "$next"
          # the tag push emits no event — run release.yaml on the tag ref directly
          gh workflow run release.yaml --ref "$next"
          echo "release $next dispatched" >> "$GITHUB_STEP_SUMMARY"
        fi
