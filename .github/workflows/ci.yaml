name: Python Checks
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# Keyed on the event too, not just the ref: automation dispatches this workflow
# and then blocks on the contexts that run produces, so a plain ref-keyed group
# would let an ordinary push cancel the run something is still waiting on.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: pyproject.toml
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false
    - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
    - run: uv pip install "$(uv export --no-hashes --frozen | grep '^ruff==')"
    - run: uv run --frozen --no-sync -- ruff format . --check
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: pyproject.toml
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false
    - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
    - run: uv pip install "$(uv export --no-hashes --frozen | grep '^ruff==')"
    - run: |
        uv run --frozen --no-sync -- ruff check .
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: pyproject.toml
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false
    - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
    - run: uv sync --frozen --all-extras
    - name: Typecheck
      run: uv run --frozen -- ty check
  # The embedded vpic.rkyv is gitignored, so the extension only decodes real VINs
  # if the artifact is materialized first. Build it once (deterministically from
  # the pinned dump) and hand it to the test jobs — otherwise build.rs bakes in an
  # empty stub and the parity corpus fails wholesale.
  data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - uses: ./.github/actions/build-data
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vpic-data
        path: crates/ultravin/data/vpic.rkyv
        if-no-files-found: error
  # Every push, checked against the oracle's own frozen answers for this data
  # month — ~1.8M of them, and no Postgres involved. A hard gate with no skip
  # path: `answerkey fetch` refuses a missing pin and a pin for another month,
  # so a data month can only land together with its key. The refresh pipeline
  # makes that atomic — answer-key.yaml builds the key ON the data branch and
  # commits tests/answerkey.json into the same PR (see that workflow's header).
  # Until the pin lands, this job is red on the data PR; that is the gate
  # working, not a flake. Tampering fails closed too: deleting or rewriting the
  # pin fails fetch on the month or the checksum, and the key asset itself
  # cannot be forged without write access to the data-<month> release.
  answerkey:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: pyproject.toml
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vpic-data
        path: crates/ultravin/data
    - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
    - run: uv sync --frozen --all-extras
    - name: Verify against the frozen answers
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        uv run --frozen -- python -m scripts.parity.answerkey fetch
        uv run --frozen -- python -m scripts.parity.answerkey verify --key target/answerkey
  test:
    needs: data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    # 3.15 is prerelease until 2026-10; its row may not block merges. Drop the
    # exemption (and allow-prereleases) once 3.15.0 final is out.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        # Cache only where it pays: 3.15 builds pyarrow from sdist (~minutes),
        # and setup-uv's `uv cache prune --ci` keeps source-built wheels, so
        # the build is paid once per uv.lock change. Wheel-only rows stay
        # cacheless.
        enable-cache: ${{ matrix.python-version == '3.15' }}
    # pyarrow publishes no cp315 wheels yet, so on 3.15 uv builds it from
    # sdist, which needs an Arrow C++ whose major version matches pyarrow's.
    # apt installs the repo's newest; when Arrow's next major lands there ahead
    # of the locked pyarrow, this row goes red (it doesn't block merges) — pin
    # libarrow-dev to the locked major if that gap ever matters. Drop this
    # step, the cache exception above, and allow-prereleases once 3.15.0 final
    # is out and cp315 wheels ship.
    - name: Install Arrow C++ (pyarrow sdist build)
      if: matrix.python-version == '3.15'
      run: |
        wget -q "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr '[:upper:]' '[:lower:]')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
        sudo apt-get install -y -V ./apache-arrow-apt-source-latest-*.deb
        sudo apt-get update
        sudo apt-get install -y -V libarrow-dev libarrow-dataset-dev libparquet-dev
        # pyarrow's AUTO component options inherit the flags of apt's
        # kitchen-sink Arrow build, and every inherited component whose
        # separate -dev package is missing dies in find_package (first
        # Flight, then CUDA). Pin all of them so apt's Arrow flags can't
        # steer the build: on for what the tests import (pyarrow.parquet)
        # plus the dataset/acero configs libarrow-dev already provides,
        # off for the rest.
        {
          echo "PYARROW_WITH_PARQUET=1"
          echo "PYARROW_WITH_DATASET=1"
          echo "PYARROW_WITH_ACERO=1"
          for c in AZURE CUDA FLIGHT GANDIVA GCS HDFS ORC PARQUET_ENCRYPTION S3 SUBSTRAIT; do
            echo "PYARROW_WITH_$c=0"
          done
        } >> "$GITHUB_ENV"
    # Place the artifact where include_bytes! expects it, before uv sync builds
    # the extension (build.rs leaves an existing file untouched).
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vpic-data
        path: crates/ultravin/data
    - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
    - run: uv sync --frozen --all-extras
    - name: Test with python ${{ matrix.python-version }}
      run: uv run --frozen --all-extras -- pytest -v
  # `make rust` (fmt-check, clippy, cargo test) — the same gate dev machines run.
  # Without this job PR CI runs zero cargo commands, so Rust regressions merge
  # ungated. Needs the real artifact: the decode tests skip on build.rs's empty
  # placeholder (Db::try_embedded()), so without it the test phase is vacuous.
  rust:
    needs: data
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    # clippy lints the whole workspace including the PyO3 crate, so pyo3 needs a
    # Python interpreter at build-config time.
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: pyproject.toml
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    # Place the artifact where include_bytes! expects it before cargo builds the
    # crate; build.rs leaves an existing file untouched (same as the test job).
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vpic-data
        path: crates/ultravin/data
    - run: make rust