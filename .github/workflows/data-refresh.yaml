# Monthly NHTSA vPIC data refresh, fully automated.
#
#   detect   daily probe for a dump newer than the vpic/manifest.json pin
#   refresh  mechanical integration + parity gates (scripts/refresh.py run),
#            then a `data/<month>` branch and a classified pull request
#
# Secrets/variables (all optional):
#   vars.DATA_REFRESH_AUTOMERGE        "true" merges data-only PRs once checks pass
#   vars.DATA_REFRESH_AUTOMERGE_SCHEMA "true" extends merging to schema-change months
#   vars.DATA_REFRESH_AUTORELEASE      "true" also tags the next patch version and
#                                      dispatches release.yaml after merge
# No GitHub App and no PAT: GITHUB_TOKEN *events* never trigger workflows, but
# explicit workflow_dispatch calls do — so the pipeline kicks ci.yaml and
# data-review.yaml itself and merges synchronously (.github/actions/merge-data-pr).
# See docs/DATA_REFRESH.md for the full runbook.
name: Data Refresh
on:
  schedule:
    - cron: "23 20 * * *" # daily 20:23 UTC; NHTSA uploads land 13:15-19:16 UTC, day 9-18
  workflow_dispatch:
    inputs:
      month:
        description: "Force integration of this YYYY_MM (skips detection)"
        required: false
        default: ""

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      month: ${{ steps.pick.outputs.month }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe NHTSA for a newer dump
        id: detect
        env:
          FORCE_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$FORCE_MONTH" ]; then
            python3 scripts/refresh.py detect --month "$FORCE_MONTH"
          else
            python3 scripts/refresh.py detect
          fi
      - name: Skip if an open refresh PR already exists
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.detect.outputs.month }}
          REASON: ${{ steps.detect.outputs.reason }}
        run: |
          if [ -z "$MONTH" ]; then
            echo "month=" >> "$GITHUB_OUTPUT"
            echo "nothing newer than the pinned month" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open_pr=$(gh pr list --head "data/$MONTH" --state open --json number --jq length)
          if [ "$open_pr" != "0" ] && [ "$REASON" != "forced" ]; then
            echo "month=" >> "$GITHUB_OUTPUT"
            echo "refresh PR for $MONTH already open — not stacking another run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: detect
    if: needs.detect.outputs.month != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write # `gh label create` writes labels through the Issues API
      actions: write # fallback `gh workflow run` CI kick when pushing with GITHUB_TOKEN
    env:
      MONTH: ${{ needs.detect.outputs.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
      - name: Integrate and gate
        id: run
        run: python3 scripts/refresh.py run --month "$MONTH"
      - name: Branch, push, pull request
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFICATION: ${{ steps.run.outputs.classification }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "data/$MONTH"
          git add -A vpic tests/parity_corpus.json
          git commit -m "data: NHTSA vPIC $MONTH ($CLASSIFICATION)"
          git push -f origin "data/$MONTH"
          gh label create data-refresh --color 0E8A16 --description "automated monthly vPIC data update" || true
          gh label create schema-change --color D93F0B --description "vpic/schema or vpic/procs changed" || true
          if [ "$(gh pr list --head "data/$MONTH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base master --head "data/$MONTH" \
              --title "data: NHTSA vPIC $MONTH ($CLASSIFICATION)" \
              --body-file target/refresh/report.md \
              --label data-refresh
          else
            gh pr edit "data/$MONTH" --body-file target/refresh/report.md
          fi
          if [ "$CLASSIFICATION" = "schema-change" ]; then
            gh pr edit "data/$MONTH" --add-label schema-change
          fi
          # GITHUB_TOKEN events don't trigger workflows; explicit dispatches do.
          gh workflow run ci.yaml --ref "data/$MONTH"
          gh workflow run data-review.yaml -f pr="$(gh pr view "data/$MONTH" --json number --jq .number)"
          # Bot-authored PRs also spawn approval-gated pull_request runs whose
          # queued check suites hold the required contexts in "expected" state,
          # blocking the merge. Approve them so they run instead of dangling.
          head=$(gh pr view "data/$MONTH" --json headRefOid --jq .headRefOid)
          for rid in $(gh api "repos/${{ github.repository }}/actions/runs?status=action_required&head_sha=$head" --jq '.workflow_runs[].id'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$rid/approve" \
              || echo "::warning::could not approve gated run $rid — merge may stall on expected checks"
          done
      - name: Merge per policy, tag, release
        if: steps.run.outputs.changed == 'true'
        uses: ./.github/actions/merge-data-pr
        with:
          month: ${{ env.MONTH }}
          automerge: ${{ vars.DATA_REFRESH_AUTOMERGE }}
          automerge-schema: ${{ vars.DATA_REFRESH_AUTOMERGE_SCHEMA }}
          autorelease: ${{ vars.DATA_REFRESH_AUTORELEASE }}
      # On failure, bank evidence for manual remediation — above all the
      # vpic/ text diff, which captures the upstream change.
      - name: Capture failure context
        if: failure()
        run: |
          mkdir -p target/refresh
          git diff -- vpic/schema vpic/procs > target/refresh/vpic-schema.diff || true
          git diff --stat -- vpic > target/refresh/vpic-diff.stat || true
          git status --porcelain > target/refresh/git-status.txt || true
      - name: Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-report
          path: target/refresh/
          if-no-files-found: ignore
