name: Release

# Cross-platform wheel + sdist build, PyPI publish, and a GitHub release
# carrying the data artifact for Rust-crate users. Mirrors the pypiron
# pipeline, adapted for a PyO3 abi3 extension module (one wheel per platform
# covers Python 3.10+) whose 82MB vpic.rkyv data artifact is gitignored and
# rebuilt deterministically from the pinned dump before any wheel compiles.
#
# Versions come solely from git tags: the repo carries 0.0.0 and CI stamps the
# tag's vX.Y.Z before building. workflow_dispatch dry-runs the full matrix
# (artifacts only, version stays 0.0.0); only tags publish. See docs/RELEASE.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Retry crates.io fetches: the registry occasionally drops a download mid-build.
  CARGO_NET_RETRY: "10"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch protection does not cover tags: a pushed vX.Y.Z can point at any
  # commit, and this workflow builds and trusted-publishes from the tagged
  # commit — so a tag at an arbitrary, unreviewed commit would otherwise ship to
  # PyPI, bypassing code review. Refuse unless the built commit is reachable from
  # master. Every job on the publish path needs this, so an unauthorized tag
  # never even starts the wheel matrix. Only tag pushes publish (the release job
  # is tag-gated); a workflow_dispatch dry-run runs on a branch ref, never
  # publishes, and is exempt — enforcing ancestry there would only wrongly block
  # a legit dry-run from an unmerged branch.
  authorize:
    name: authorize (tag reachable from master)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag not reachable from master
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "authorized: $GITHUB_SHA is reachable from master"
          else
            echo "::error::tag commit $GITHUB_SHA is not on master — refusing to release"
            exit 1
          fi

  # Nothing publishes unless the Rust side is clean. Data-dependent tests skip
  # gracefully without the artifact (see tests/decode.rs), so this needs no data.
  gate:
    name: rust gate (fmt, clippy, test)
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude ultravin-py --locked

  # Materialize the embedded data artifact ONCE, deterministically, from the
  # pinned dump — every wheel/sdist job below downloads and reuses it. The job is
  # self-verifying: the downloaded dump's sha256 and the emitted artifact's blake3
  # must both match what vpic/manifest.json pins. The importer is a pure function
  # of the dump bytes, so a matching input guarantees a byte-identical output.
  build-data:
    name: build data artifact
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: ./.github/actions/build-data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vpic-data
          path: crates/ultravin-core/data/vpic.rkyv
          if-no-files-found: error

  # One job, one matrix over every (kind, runner, target). abi3 means a single
  # wheel per platform serves Python 3.10+. No zig/CFLAGS: the crate is pure Rust
  # (blake3 uses its `pure` feature), so every cross target builds with the
  # default cross-gcc. fail-fast is off so one platform's failure spares the rest.
  wheels:
    name: wheels (${{ matrix.kind }}, ${{ matrix.target }})
    needs: [authorize, build-data]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: linux,     runner: ubuntu-22.04,   target: x86_64,  smoke: true }
          - { kind: linux,     runner: ubuntu-22.04,   target: x86 }
          # manylinux_2_28: this is the one mimalloc-carrying cross target, and the
          # default (manylinux2014) cross-gcc predates -Wdate-time, so mimalloc's C
          # build fails on it. The 2.28 cross image ships a modern gcc. (x86_64 is
          # native devtoolset gcc; musl/other arches are unaffected.)
          - { kind: linux,     runner: ubuntu-22.04,   target: aarch64, manylinux: manylinux_2_28 }
          - { kind: linux,     runner: ubuntu-22.04,   target: armv7 }
          - { kind: linux,     runner: ubuntu-22.04,   target: s390x }
          - { kind: linux,     runner: ubuntu-22.04,   target: ppc64le }
          - { kind: linux,     runner: ubuntu-22.04,   target: riscv64 }
          - { kind: musllinux, runner: ubuntu-22.04,   target: x86_64,  manylinux: musllinux_1_2, container_smoke: true }
          - { kind: musllinux, runner: ubuntu-22.04,   target: x86,     manylinux: musllinux_1_2 }
          - { kind: musllinux, runner: ubuntu-22.04,   target: aarch64, manylinux: musllinux_1_2 }
          - { kind: musllinux, runner: ubuntu-22.04,   target: armv7,   manylinux: musllinux_1_2 }
          # pyarch picks the real interpreter setup-python installs (below): a
          # 32-bit Python for the x86 wheel, the x64 host Python for x64 and the
          # aarch64 cross (abi3 + pyo3's generated import lib need no arm Python).
          - { kind: windows,   runner: windows-latest, target: x64,     pyarch: x64, smoke: true }
          - { kind: windows,   runner: windows-latest, target: x86,     pyarch: x86, smoke: true }
          - { kind: windows,   runner: windows-latest, target: aarch64, pyarch: x64 }
          # GitHub retired macos-13 (Intel) on 2025-12-04; macos-15-intel is the
          # standard x86_64 replacement. macos-14 is Apple silicon.
          - { kind: macos,     runner: macos-15-intel, target: x86_64,  smoke: true }
          - { kind: macos,     runner: macos-14,       target: aarch64, smoke: true }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./.github/stamp-version.sh "$GITHUB_REF_NAME"
      # Drop the prebuilt artifact where include_bytes! expects it. build.rs only
      # writes its empty stub when the file is absent, so this real data is used.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vpic-data
          path: crates/ultravin-core/data
      # Without this, maturin on Windows finds only the WindowsApps python.exe
      # alias stub, can't read its version, and fails — give it a real, arch-
      # matched interpreter instead. (Linux builds in a container; macOS uses the
      # host Python — both already have a usable interpreter.)
      - name: Set up Python (Windows)
        if: matrix.kind == 'windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.pyarch }}
      # PyPI can't resolve repo-relative README paths (the benchmark SVG 404s);
      # bake absolute URLs into the wheel metadata while the repo file stays
      # relative for GitHub. Windows runners may lack a `python3` shim.
      - name: Rewrite README links to absolute URLs for PyPI
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/transform_readme.py --target pypi
          else
            python scripts/transform_readme.py --target pypi
          fi
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
      # Fingerprint dist/ the moment it's built and stash the digest OUTSIDE
      # dist/. The smoke steps below run pip/docker with network access; a
      # compromised action or PyPI dependency could rewrite an already-built
      # wheel in that window and still pass its own smoke. The verify step just
      # before upload re-checks these digests so a tampered artifact can never
      # reach trusted publishing unnoticed.
      - name: Record dist digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/* > "${RUNNER_TEMP}/dist.sha256"
      # Prove the wheel we just built actually decodes before it can be published
      # (build.rs can emit an import-clean, decode-nothing stub). Only matrix.smoke
      # rows run the wheel natively on their runner; cross-compiled and libc-
      # mismatched wheels can't execute here and are skipped with a visible note
      # (no QEMU). Windows reuses the arch-matched interpreter set up above; other
      # runners get one here (native arch — matches the wheel).
      - name: Set up Python for smoke
        if: ${{ matrix.smoke && runner.os != 'Windows' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Smoke test the built wheel
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            export ULTRAVIN_EXPECT_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then PY=python; else PY=python3; fi
          "$PY" scripts/wheel_smoke.py dist/*.whl
      # musl wheels can't run on the glibc runner, but docker can: run the same
      # smoke inside Alpine. This leg exists because v0.0.3–v0.0.6 shipped musl
      # wheels that couldn't even be imported (mimalloc compiled with initial-exec
      # TLS, which musl's dlopen refuses) and nothing noticed. One row — x86_64,
      # the runner's native docker arch — covers the class; aarch64 musl would
      # need QEMU and stays build-only.
      - name: Smoke test the musllinux wheel in an Alpine container
        if: matrix.container_smoke
        run: |
          set -euo pipefail
          EXPECT=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            EXPECT="-e ULTRAVIN_EXPECT_VERSION=${GITHUB_REF_NAME#v}"
          fi
          docker run --rm $EXPECT -v "$PWD:/repo:ro" python:3.12-alpine \
            sh -c 'python3 /repo/scripts/wheel_smoke.py /repo/dist/*.whl'
      - name: Note wheel not smoked (cross-compiled / libc-incompatible)
        if: ${{ !matrix.smoke && !matrix.container_smoke }}
        run: echo "::notice::${{ matrix.kind }}/${{ matrix.target }} wheel is cross-compiled or libc-incompatible with this runner — built, not smoked"
      # Fail loudly if any dist/ file changed since it was built, before it can
      # be uploaded and (on a tag) trusted-published.
      - name: Verify dist unchanged since build
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/dist.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.kind }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    name: sdist
    needs: [authorize, build-data]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./.github/stamp-version.sh "$GITHUB_REF_NAME"
      # The sdist embeds the artifact (pyproject [tool.maturin] include) so a
      # source install works offline — without it, build.rs would stub an empty
      # one and the decoder would return nothing.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vpic-data
          path: crates/ultravin-core/data
      - name: Rewrite README links to absolute URLs for PyPI
        run: python3 scripts/transform_readme.py --target pypi
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      # Same dist-integrity guard as the wheels job: fingerprint the freshly
      # built sdist outside dist/ before the source-build smoke runs, then verify
      # it just before upload so nothing in the smoke window can tamper with the
      # artifact that gets published.
      - name: Record dist digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/* > "${RUNNER_TEMP}/dist.sha256"
      # Smoke the sdist as a real source build (pip install compiles it from
      # source), the one path that exercises build.rs picking up the embedded
      # vpic.rkyv — the exact "source install stubs empty data" failure the
      # pyproject include guards against. Needs the Rust toolchain the wheel jobs
      # get from maturin-action; the sdist build itself only packages source.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up Python for smoke
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Smoke test the sdist (source build)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            export ULTRAVIN_EXPECT_VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/wheel_smoke.py dist/*.tar.gz
      # Fail loudly if the sdist changed since it was built, before upload/publish.
      - name: Verify dist unchanged since build
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/dist.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [gate, wheels, sdist]
    permissions:
      id-token: write       # PyPI trusted publishing (OIDC) + provenance
      attestations: write   # build-provenance attestation
      contents: write       # create the GitHub release + data asset
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vpic-data
          path: data
      # Build-provenance attestation is a public-repo-only feature; it skips on a
      # private repo and reactivates automatically once the repo is public.
      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
      # The Rust crate can't ship the 82MB artifact (crates.io size cap), so the
      # GitHub release carries the exact vpic.rkyv this release embeds — crate
      # users mmap it (external-data) or bake it in themselves. Verify against
      # artifact_blake3 in the tag's vpic/manifest.json. Runs after PyPI publish
      # so a hiccup here never blocks the wheels.
      - name: Create GitHub release with the data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" data/vpic.rkyv --repo "$GITHUB_REPOSITORY" --clobber
