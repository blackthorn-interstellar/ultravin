# Free multi-scanner security suite — mirrors what corporate AppSec stacks
# (Snyk, Black Duck, Sonar, GitGuardian, Checkmarx, …) typically surface:
#
#   SCA     cargo-audit, cargo-deny, pip-audit, OSV-Scanner, Trivy
#   SAST    CodeQL (python + rust + actions), Semgrep community
#   Secrets gitleaks, TruffleHog (verified only), Trivy secret mode
#   Supply  OpenSSF Scorecard, zizmor (Actions), actionlint
#   Optional Snyk (runs only when SNYK_TOKEN is set in repo secrets)
#
# Every tool here is free to run on this repo. Note the distinction for
# gitleaks: the MIT-licensed binary is free for everyone, but the official
# gitleaks-action hard-fails on organization-owned repos without a paid
# GITLEAKS_LICENSE — so the job below downloads and runs the binary directly.
# Results land in the job summary and, where supported, GitHub Code Scanning
# (Security tab). Every job here hard-fails on a finding — the tree is at zero
# across all of them. Only Snyk soft-fails, since it no-ops without a token.
name: Security

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly Monday 09:17 UTC — far from nightly (08:41) and data-refresh (20:23)
    - cron: "17 9 * * 1"
  workflow_dispatch:

# Keyed on the event too: a master push and the weekly scheduled run share a
# ref, so without this a routine push would cancel the scheduled full scan.
concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Secrets ───────────────────────────────────────────────────────────
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The scan walks every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      # The binary is MIT and unlicensed-free; gitleaks-action is not (it
      # demands a paid GITLEAKS_LICENSE on org repos). Pin the release and
      # verify its digest — this runs with the repo checked out.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Rules and path allowlist come from the repo's .gitleaks.toml.
      - name: Scan full history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact -v

  trufflehog:
    name: secrets (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          # Verified findings only — unverified is mostly noise for this purpose.
          # lob is excluded: the action runs the floating :latest engine
          # regardless of the pin above, and v3.96.0 widened the Lob key regex
          # to (live|test)_[a-zA-Z0-9_]{35}, which matches 40-char snake_case
          # pytest names in git history — and Lob's API "verifies" the garbage.
          # Tightened upstream after 3.96.0; this repo will never hold a Lob
          # (postal-mail API) key anyway.
          extra_args: --only-verified --exclude-detectors=lob

  # ─── SCA: known CVEs in dependencies ───────────────────────────────────
  cargo-audit:
    name: sca (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: sca (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # advisories hard-fail; licenses/bans/sources configured in deny.toml
          command: check
          arguments: --all-features

  pip-audit:
    name: sca (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: Sync env + audit installed packages
        run: |
          # Audit the resolved env (incl. dev deps). Prefer --local over
          # requirements-file mode: pip-audit's venv resolver fights uv-managed
          # Pythons that ship without ensurepip.
          echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
          uv sync --frozen --all-extras
          uv run --with pip-audit pip-audit --local --progress-spinner off

  osv:
    name: sca (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # Cargo.lock + uv.lock (and any other supported manifests). v2 dropped
          # --skip-git and already excludes .git by default.
          scan-args: |-
            --recursive
            ./
      # osv-scanner-action fails the step on vulns; surface is enough

  trivy:
    name: sca+secrets+misconfig (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # One scan, not two: trivy writes the SARIF and then applies exit-code, so
      # a single invocation both fails the job and leaves a report to upload.
      - name: Trivy filesystem scan
        # v0.30.0 broke when upstream deleted the setup-trivy v0.2.2 tag its
        # composite referenced; v0.36.0 SHA-pins setup-trivy and a concrete
        # trivy engine (v0.70.0), so nothing inside floats anymore.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # vuln + secret + misconfig covers SCA, secrets, docker-compose IaC
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          skip-dirs: target,campaign,downloads,.git
      # always(): the scan above fails the job on findings, and those are
      # exactly the runs whose SARIF Code Scanning needs.
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ─── SAST ──────────────────────────────────────────────────────────────
  codeql:
    name: sast (codeql ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Free on public repos. actions catches workflow injection patterns.
        language: [python, rust, actions]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          # security-extended catches more of what commercial SAST reports
          queries: security-extended
      # autobuild compiles the whole workspace including the PyO3 crate, so pyo3
      # needs a Python interpreter at build-config time (same as ci.yaml's rust job).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: pyproject.toml
      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Semgrep community rules
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif \
            --error \
            --exclude='target/**' \
            --exclude='campaign/**' \
            --exclude='downloads/**' \
            --exclude='**/*.rkyv' \
            .
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── Supply chain / Actions hygiene ────────────────────────────────────
  zizmor:
    name: actions (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      # A real gate: zizmor exits non-zero on findings, so no second pass is
      # needed. Deliberate exceptions live in .github/zizmor.yml.
      - name: Audit workflows
        shell: bash
        run: |
          set -euo pipefail
          uvx zizmor==1.29.0 --format plain .github/workflows .github/actions \
            | tee "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: actions (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          args: -color

  scorecard:
    name: supply-chain (openssf scorecard)
    # Scorecard wants the default branch; on PRs the signal is weaker.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing to the public OpenSSF API is a weekly signal, not a
          # per-commit one. Every master push still scans and uploads SARIF to
          # Code Scanning; only the scheduled/manual runs publish.
          publish_results: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
          category: openssf-scorecard

  # ─── Optional commercial (free tier) ───────────────────────────────────
  snyk:
    name: sca+sast (snyk)
    # Free plan works. Job-level `if` cannot read secrets (GitHub context rule),
    # so we always schedule the job and no-op when SNYK_TOKEN is unset.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip when unconfigured
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set — skipping (add repo secret to enable free-tier Snyk)"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: env.SNYK_TOKEN != ''
        with:
          persist-credentials: false
      # snyk/actions publishes no tags — master is the only ref upstream
      # documents, so pin the commit master pointed at.
      - uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # master @ 2026-08-03
        if: env.SNYK_TOKEN != ''
      - name: Snyk Open Source (all projects)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: |
          snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-oss.sarif
      - name: Snyk Code (SAST)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: |
          snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
      - name: Upload Snyk OSS SARIF
        if: env.SNYK_TOKEN != '' && hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss
        continue-on-error: true
      - name: Upload Snyk Code SARIF
        if: env.SNYK_TOKEN != '' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
        continue-on-error: true
