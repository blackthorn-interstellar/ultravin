# Findings we accept deliberately. Everything else fails the zizmor job in
# .github/workflows/security.yaml, so keep this list short and justified.
rules:
  dangerous-triggers:
    ignore:
      # data-review.yaml needs pull_request_target to read repo secrets when
      # reviewing bot-authored data PRs. Audited: it checks out the base ref,
      # never the PR head, so no untrusted code executes with that token.
      - data-review.yaml

  artipacked:
    # These five jobs `git push -f` a bot branch using the credential checkout
    # persists into .git/config, so persist-credentials: false would break them.
    # The real fix is persist-credentials: false + `gh auth setup-git` (already
    # the pattern in nightly.yaml's deps-checks/deps-fixes jobs, L472+L498 and
    # L630+L768); porting it here is deferred, not rejected.
    #
    # Pinned to the checkout's line so a NEW job that persists credentials still
    # fails the gate. These pins fail closed, but silently: zizmor does not warn
    # that an ignore went stale, so a line that drifts simply stops matching and
    # the original finding comes back. If Security goes red with an artipacked
    # finding at one of the checkouts below after an unrelated edit, the pin
    # drifted — re-pin it rather than widening these to bare filenames.
    ignore:
      - answer-key.yaml:192   # job `publish` — pushes the answer-key pin branch (L255)
      - data-refresh.yaml:96  # job `refresh` — pushes data/$MONTH (L127)
      - data-refresh.yaml:395 # job `fix-publish` — re-pushes data/$MONTH after an agent fix (L418)
      - nightly.yaml:137      # job `deps-publish` — pushes deps/nightly (L154)
      - nightly.yaml:351      # job `deps-fix-publish` — re-pushes deps/nightly after a fix (L372)
