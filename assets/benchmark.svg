<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<desc>Ultravin: September 25, 2026, Apple M2 Max (8 performance + 4 efficiency cores), twenty million unique synthetic VINs, ~95% valid and ~5% with one realistic defect; Ultravin rows decode the corpus in random or sorted order, as marked; the overlapping bars in a row are the worker counts labelled on them. Other engines retain historical comparison figures.</desc>
<style>.background{fill:#ffffff}.label{fill:#57606a;font-size:13px}.value{fill:#57606a;font-size:13px}.strong{fill:#1f2328;font-weight:700}.axis{fill:#8c8c98;font-size:11px}.grid{stroke:#d8dee4;stroke-width:1}.bar{fill:#c3aef5}.bar-hi{fill:#7c4dff}.s0{fill:#4a1fd6}.s1{fill:#7c4dff}.s2{fill:#b9a4ff}.s3{fill:#ddd3ff}.on{fill:#ffffff;font-size:11px;font-weight:600}.on2,.on3{fill:#2a1466}@media(prefers-color-scheme:dark){.background{fill:#0d1117}.label,.value{fill:#9198a1}.strong{fill:#f0f6fc}.axis{fill:#7d8590}.grid{stroke:#30363d}.bar{fill:#6b5bb0}.bar-hi{fill:#a786ff}.s0{fill:#5b33e0}.s1{fill:#8a63ff}.s2{fill:#b9a4ff}.s3{fill:#ddd3ff}}</style>
