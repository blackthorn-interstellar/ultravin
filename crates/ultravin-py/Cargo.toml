[package]
name = "ultravin-py"
description = "PyO3 bindings for the ultravin VIN decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "_ultravin"
crate-type = ["cdylib"]

[dependencies]
ultravin = { path = "../ultravin", features = ["parquet"] }
# The dataset door hands back arrow `RecordBatch`es from ultravin; these two
# crates are only for reading them back out (schema field names, typed column
# downcasts) when marshalling to Python dicts. Same versions the core pins, so
# they resolve to the one already-locked copy.
arrow-array = "59.2"
arrow-schema = "59.2"
# Windows links python3.dll via raw-dylib (pyo3 0.29+), so no import lib is
# needed even for the aarch64 cross-build — the old generate-import-lib
# feature is an inert no-op now and deliberately dropped.
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }

# Sharded allocator for the decode hot path. The engine is allocation-bound, and
# the system allocator's global lock serializes the parallel `decode_batch` across
# rayon workers; mimalloc's per-thread heaps remove that contention (and cut
# single-stream malloc cost too). default-features off drops the `secure` guards
# we don't need. Only the Rust extension's allocations route through it; Python's
# own objects keep using Python's allocator.
#
# `v2`: libmimalloc-sys defaults to the mimalloc v3 C sources, which are the
# experimental line with a live trail of heap-corruption/segfault reports in
# multi-allocator processes (e.g. alongside pyarrow's bundled mimalloc). Pin the
# mature v2 line; per-thread heaps — the property we're here for — are v2's too.
# `local_dynamic_tls`: without it mimalloc compiles with -ftls-model=initial-exec,
# which is illegal in a dlopen'd library. musl refuses to load the extension at
# all ("initial-exec TLS resolves to dynamic definition" — the musllinux wheels
# were unimportable), and on glibc it silently burns the process-wide static-TLS
# surplus other libraries need. A Python extension is always dlopen'd, so
# local-dynamic is the only correct model here.
#
# Gated to the mainstream 64-bit arches (covers macOS x86_64/aarch64, Linux
# gnu+musl x86_64/aarch64, Windows x64/aarch64): mimalloc compiles a vendored C
# blob via `cc`, and the release matrix cross-builds the exotic targets (x86,
# armv7, s390x, ppc64le, riscv64) with a plain cross-gcc and no extra C toolchain
# wiring — keeping the crate pure-Rust there (see .github/workflows/release.yaml).
# Those targets fall back to the system allocator; perf there is not a goal.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2", "local_dynamic_tls"] }

[lints]
workspace = true
