[package]
name = "ultravin"
description = "Pure-Rust NHTSA vPIC VIN decoder engine with spVinDecode parity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

readme = "README.md"
keywords = ["vin", "nhtsa", "vpic", "vehicle", "decoder"]
categories = ["parsing", "database-implementations"]
# The 82 MB artifact is a build product fetched from a GitHub release (see
# build.rs); it never ships in the package. Its directory does (data/.gitkeep)
# so build.rs has something to watch.
exclude = ["data/*.rkyv"]

[features]
default = ["download-data"]
# build.rs fetches this version's vpic.rkyv from its GitHub release when no
# artifact is supplied — once per machine, blake3-verified against
# data/manifest.json, then embedded. Off for offline/reproducible builds:
# supply ULTRAVIN_DATA, or load a file at runtime via `external-data`.
download-data = ["dep:ureq"]
# `Db::open`: mmap an artifact file at runtime instead of baking one in.
external-data = ["dep:memmap2"]
# The dataset door (`parquet_io`): parquet in, parquet out. Off by default so an
# embedder that only decodes does not compile arrow.
parquet = ["dep:arrow-array", "dep:arrow-cast", "dep:arrow-schema", "dep:parquet"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

# blake3's `pure` feature forces the portable-Rust impl, skipping its C/asm SIMD
# build. blake3 only hashes the artifact at build time (never on the decode path),
# so the speed is irrelevant — and dropping the C build is what lets every cross
# target (aarch64/armv7/s390x/ppc64le/riscv64/musl) compile with a plain
# cross-gcc, no zig. See .github/workflows/release.yaml.
[dependencies]
blake3 = { version = "1.8.5", features = ["pure"] }
memmap2 = { version = "0.9.11", optional = true }
rayon = "1.12.0"
regex = "1.12.4"
rkyv = "0.8"
# JSON output path: serializing the decode result in Rust (during the parallel,
# GIL-released phase) hands Python a single string instead of building ~900
# PyDict_SetItem/VIN — the only way past the list[dict] marshalling floor. Both
# crates are pure Rust, so the cross-compile matrix is unaffected.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dataset path (decode-parquet): parquet row-group streaming in Rust so no row
# ever becomes a Python object. arrow/parquet are pure Rust — the exotic
# cross-compile targets stay plain-gcc buildable, same as serde above.
arrow-array = { version = "59.2", optional = true }
arrow-cast = { version = "59.2", optional = true }
arrow-schema = { version = "59.2", optional = true }
parquet = { version = "59.2", default-features = false, features = ["arrow", "snap"], optional = true }

[build-dependencies]
blake3 = { version = "1.8.5", features = ["pure"] }
rkyv = "0.8"
# download-data only. rustls + ring + webpki-roots; ring's C is host-only (a
# build dependency never cross-compiles), so the crate stays pure Rust for
# every target.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Bench/example only: the throughput probe uses the same sharded allocator as the
# shipped wheel so its measured ceiling matches production — same features too
# (v2 + local_dynamic_tls; see ultravin-py's Cargo.toml for why). Gated to
# mainstream 64-bit arches for the same pure-Rust-cross reason as ultravin-py;
# examples fall back to the system allocator elsewhere.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dev-dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2", "local_dynamic_tls"] }

[[bench]]
name = "decode"
harness = false
